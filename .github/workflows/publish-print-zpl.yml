name: Publish print-zpl

on:
  workflow_dispatch:
  push:
    tags:
      - "print-zpl-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@yinshu-print"
      - run: npm ci
      - run: npm publish --workspace @yinshu-print/print-zpl --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
